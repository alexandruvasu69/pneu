name: Flutter CI Workflow

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      
jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create .env file
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
    
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4
      - run: flutter clean
      - run: flutter pub get

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Update PATH for Android SDK tools
        run: echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK Platform 34 and Build Tools 34.0.0
        run: | 
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: List installed Android SDK packages
        run: | 
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list | grep platforms
      
      - run: flutter test
      - run: flutter build apk
      - run: flutter build appbundle

  flutter-ios:
      runs-on: macos-latest
      env:
        MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      steps:
        - name: Clone repository
          uses: actions/checkout@v4

        - name: Create .env file
          run: |
            echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
  
        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: 3.24.4

        - name: Install dependencies
          run: flutter pub get
  
        - name: Install CocoaPods
          run: |
            sudo gem install cocoapods
            cd ios && pod install
  
        - name: Build iOS app
          run: flutter build ios --no-codesign
